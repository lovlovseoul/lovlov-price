name: update-prices
on:
  workflow_dispatch:
  # 시험이 끝나면 아래 두 줄의 # 를 지우면 자동으로 돕니다 (UTC 기준, 한국시간 -9시간).
  # schedule:
  #   - cron: '7 0,5,10 * * *'
permissions:
  contents: write
concurrency:
  group: update-prices
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright && playwright install --with-deps chromium
      - run: python scrape.py
      - name: commit
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add lovlov_prices.csv
          git diff --cached --quiet || (git commit -m "update prices" && git push)
